<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mTECH | Fire & Electrical Audits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans">

    <!-- Mock Website Header -->
    <header class="bg-blue-900 text-white p-6 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-wider"><i class="fas fa-bolt text-yellow-400"></i> mTECH</h1>
            <nav class="space-x-6 hidden md:block">
                <a href="#" class="hover:text-blue-300">Services</a>
                <a href="#" class="hover:text-blue-300">Fire Assessments</a>
                <a href="#" class="bg-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-500">Get a Quote</a>
            </nav>
        </div>
    </header>

    <!-- Mock Website Hero Section -->
    <main class="flex-grow flex items-center justify-center p-6 text-center">
        <div class="max-w-2xl">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-4">Ensure Total Compliance & Safety</h2>
            <p class="text-lg text-gray-600 mb-8">Chat with our Smart Assistant below to get instant answers or a free estimate.</p>
        </div>
    </main>

    <!-- Chatbot Widget -->
    <div id="chat-widget" class="fixed bottom-6 right-6 w-80 md:w-96 bg-white rounded-xl shadow-2xl flex flex-col border border-gray-200 overflow-hidden transform transition-all duration-300">
        
        <!-- Chat Header -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center cursor-pointer" onclick="toggleChat()">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-white text-blue-600 rounded-full flex items-center justify-center font-bold"><i class="fas fa-robot"></i></div>
                <div>
                    <h3 class="font-bold">mTECH Assistant</h3>
                    <p class="text-xs text-blue-200">Online | AI-Powered</p>
                </div>
            </div>
            <i class="fas fa-chevron-down" id="chat-toggle-icon"></i>
        </div>

        <!-- Chat Body -->
        <div id="chat-body" class="h-96 flex flex-col bg-gray-50">
            <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-4"></div>
            <!-- Chat Input -->
            <div class="p-3 bg-white border-t border-gray-200 flex items-center">
                <input type="text" id="user-input" class="flex-grow p-2 border border-gray-300 rounded-l-lg focus:outline-none" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-blue-600 text-white p-2 px-4 rounded-r-lg hover:bg-blue-700">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- REAL API CONNECTION LOGIC ---
        // Change this if you deploy your Python API to the internet (e.g., Render)
        const API_BASE_URL =  "https://mtech-backend.onrender.com"; 
        
        const messagesContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        
        let chatState = 'greeting'; 
        let userData = { name: 'Guest', email: 'guest@test.com', sqft: 0, service: 'general' };

        window.onload = () => {
            appendMessage('bot', "Hi! I'm the mTECH AI. Ask me a technical question, or type <b>'quote'</b> to get an estimate.");
        };

        function toggleChat() {
            const body = document.getElementById('chat-body');
            body.style.display = body.style.display === 'none' ? 'flex' : 'none';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            msgDiv.innerHTML = `<div class="max-w-[80%] p-3 rounded-lg text-sm ${sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'}">${text}</div>`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            const typingId = 'typing-' + Date.now();
            appendMessage('bot', `<span id="${typingId}">Thinking...</span>`);

            try {
                let responseText = "";

                // Quote Generation Flow vs General Chat
                if (chatState === 'greeting' && text.toLowerCase().includes('quote')) {
                    chatState = 'ask_service';
                    responseText = "I can generate a quote! What service do you need: <b>Fire</b> or <b>Electrical</b>?";
                } 
                else if (chatState === 'ask_service') {
                    userData.service = text.toLowerCase().includes('fire') ? 'fire' : 'electrical';
                    chatState = 'ask_sqft';
                    responseText = `Got it. What is the approximate <b>square footage</b> of your facility? (Enter a number)`;
                } 
                else if (chatState === 'ask_sqft') {
                    userData.sqft = parseInt(text.replace(/[^0-9]/g, ''));
                    chatState = 'greeting'; // Reset state
                    
                    // CALL THE QUOTE ENDPOINT
                    const res = await fetch(`${API_BASE_URL}/generate_quote`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_email: userData.email, user_name: userData.name, facility_sqft: userData.sqft, service_type: userData.service })
                    });
                    const data = await res.json();
                    responseText = `✅ <b>Quote Ready:</b> ${data.message} <br><br><i>System: ${data.email_status}</i>`;
                } 
                else {
                    // CALL THE AI CHAT ENDPOINT
                    const res = await fetch(`${API_BASE_URL}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_message: text, user_email: userData.email, context: "general" })
                    });
                    const data = await res.json();
                    responseText = data.reply;
                }

                document.getElementById(typingId).parentElement.parentElement.remove();
                appendMessage('bot', responseText);

            } catch (error) {
                document.getElementById(typingId).parentElement.parentElement.remove();
                appendMessage('bot', "<i>Error: Could not connect to the backend API. Is your Python server running?</i>");
                console.error(error);
            }
        }
    </script>
</body>
</html>
